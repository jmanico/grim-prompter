<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threat model report</title>
<style>
/*TM_FONTS*/
/* One report, one page language: black bands, purple accents, square cards with a 3px accent rule. */
:root{
  --bg:#fff; --ink:#000; --muted:#5f5d68; --head:#460073; --sub:#7500c0;
  --accent:#a100ff; --accentink:#fff;
  --panel:#f6f4f9; --panel2:#ebe4f5; --line:#d9cfea; --box:#fff; --src:#f1f0f3; --srcline:#dcdae0;
  --bandbg:#000; --bandhead:#fff; --bandsub:#d2a5ff;
  --acc:#00705c; --accbg:#dcf3ee; --risk:#9a5200; --riskbg:#fdeed6; --prod:#7500c0; --prodbg:#f0e1ff;
  --bad:#b3261e; --badbg:#fde7e4; --neutral:#4a4852; --neutralbg:#ecebef;
  --find:#e0541b; --loop:#008a73; --verif:#b77400; --flow:#7500c0; --guard:#8b8992;
  --codebg:#0e0e11; --codeink:#f3eefc;
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:2px; color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#000; --ink:#fff; --muted:#b3b2b8; --head:#fff; --sub:#be82ff;
  --panel:#0e0e11; --panel2:#19181e; --line:#33313a; --box:#232129; --src:#16151a; --srcline:#33313a;
  --bandbg:#2a0845; --bandhead:#fff; --bandsub:#dcafff;
  --acc:#5fe0b8; --accbg:#0f332d; --risk:#ffc266; --riskbg:#3a2a0e; --prod:#dcafff; --prodbg:#3a1560;
  --bad:#ff8a80; --badbg:#3d1512; --neutral:#c9c7d1; --neutralbg:#2a2830;
  --find:#ff8a5c; --loop:#3ddbb0; --verif:#ffc266; --flow:#be82ff; --guard:#85838c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:44px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
a{color:var(--sub)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.86em}
.hidden{display:none!important}

/* shell */
body{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start}
#side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);font-size:14.5px}
#side .brand{display:block;padding:18px 18px 16px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
#side .brand img{display:block;max-width:180px;max-height:48px;margin-bottom:12px}
#side .brand b{display:block;font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.2}
#side .brand span{color:var(--sub);font-family:var(--f-display);font-weight:600;font-size:14px}
#sidenav{padding:10px 8px 14px;flex:1}
#sidenav a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;line-height:1.3;border-left:3px solid transparent}
#sidenav a:hover{background:var(--panel2)}
#sidenav a[aria-current="true"]{background:var(--panel2);border-left-color:var(--accent);font-weight:600}
#sidenav a.sub{padding:5px 10px 5px 22px;font-size:13.5px;color:var(--muted)}
#sidenav h6{font-family:var(--f-display);font-size:12px;font-weight:600;color:var(--sub);margin:16px 10px 6px;letter-spacing:.02em}
.sidefoot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.btn{text-decoration:none;color:var(--ink);background:var(--box);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentink)}
#main{min-width:0}
.classification{text-align:center;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;font-size:12px;padding:4px 8px;color:#fff;position:sticky;top:0;z-index:30}
#page{max-width:1560px;margin:0 auto;padding:26px 44px 90px}

/* cover */
.cover{background:var(--bandbg);color:#fff;padding:38px 40px 34px;border-left:6px solid var(--accent)}
.cover .kick{font-family:var(--f-display);font-weight:600;color:var(--bandsub);font-size:15px;margin:0 0 10px}
.cover h1{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,4vw,56px);line-height:1.04;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.cover .lede{font-size:21px;line-height:1.4;color:#e6dcf5;margin:0 0 26px;max-width:60ch}
.cover dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 28px;margin:0;border-top:1px solid #3a2b52;padding-top:20px}
.cover dt{font-size:12px;color:var(--bandsub);font-family:var(--f-display);font-weight:600}
.cover dd{margin:2px 0 0;font-size:15px}

/* sections */
section.sec{margin-top:64px}
.shead{border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:24px}
.shead small{display:block;font-family:var(--f-display);font-weight:600;color:var(--sub);font-size:15px;margin-bottom:4px}
.shead h2{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,3vw,42px);line-height:1.06;letter-spacing:-.02em;margin:0}
.shead p{font-size:18px;color:var(--muted);margin:10px 0 0;max-width:75ch;line-height:1.45}
h3{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.01em;margin:40px 0 6px}
h3+p.intro{margin-top:0}
h4{font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--sub);margin:22px 0 8px}
p{margin:0 0 12px}
p.lead{font-size:18.5px;line-height:1.6;max-width:80ch}
p.intro,.note{color:var(--muted);font-size:14.5px;max-width:95ch}
.empty{color:var(--muted);font-style:italic}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:2px 0}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;margin-top:26px}
.two h4{margin-top:0}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:26px 0}
.nums>div{padding:18px 18px 18px 0}
.nums>div+div{border-left:1px solid var(--line);padding-left:18px}
.nums b{display:block;font-family:var(--f-display);font-size:40px;line-height:1;color:var(--accent)}
.nums span{display:block;font-size:14px;line-height:1.35;margin-top:6px}
.klist{list-style:none;margin:0;padding:0}
.klist li{border-top:1px solid var(--line);padding:11px 0}
.klist b{font-family:var(--f-display);font-size:16.5px}
.klist p{margin:2px 0 0;font-size:15px;line-height:1.45}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;border-top:1px solid var(--line);padding:11px 0 11px 44px;font-size:16px;line-height:1.45}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;display:grid;place-items:center}
ol.steps .refs{display:block;margin-top:3px}
.basis{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:18px 22px;margin-top:28px;font-size:15px}
.basis h4{margin-top:0}
.basis ul{margin:0;padding-left:18px}
.card{background:var(--box);border:1px solid var(--line);border-top:3px solid var(--accent);padding:18px 20px;margin:14px 0}
.card .chead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:8px}
.card .ctitle{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.3;margin:0 0 8px}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0 18px}
th{text-align:left;font-family:var(--f-display);font-weight:600;border-bottom:2px solid var(--accent);padding:8px 12px 8px 0;white-space:nowrap;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:9px 12px 9px 0;vertical-align:top;line-height:1.45}
th.sortable{cursor:pointer;user-select:none}
th.sortable::after{content:" \2195";color:var(--muted);font-size:11px}
th.sort-asc::after{content:" \2191";color:var(--accent)} th.sort-desc::after{content:" \2193";color:var(--accent)}
.line{display:block;margin:0 0 5px}
tr:target td{background:var(--panel2)}
.card:target,details.threat:target{box-shadow:0 0 0 2px var(--accent)}
.tid{font-family:var(--f-mono);font-weight:500;color:var(--sub);white-space:nowrap}

/* chips, tags, refs */
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:3px;padding:2px 7px;text-transform:uppercase;white-space:nowrap;margin:1px 3px 1px 0;color:var(--neutral);background:var(--neutralbg)}
.tag.bad{color:var(--bad);background:var(--badbg)} .tag.ok{color:var(--acc);background:var(--accbg)}
.tag.warn{color:var(--risk);background:var(--riskbg)} .tag.info{color:var(--prod);background:var(--prodbg)}
.tag.rating{color:#fff}
.fw{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--box);margin:2px 4px 2px 0;line-height:1.35}
.fw b{font-family:var(--f-mono);font-weight:500;color:var(--sub)}
.fw.unv{border-style:dashed;color:var(--muted)}
a.ref,span.ref{font-family:var(--f-mono);font-size:12.5px;text-decoration:none;border-radius:3px;padding:1px 6px;white-space:nowrap;background:var(--panel2);color:var(--head)}
a.ref:hover{background:var(--accent);color:#fff}
span.ref{background:var(--src);color:var(--muted)}
span.ref.dangling{background:var(--badbg);color:var(--bad)}
a.ref.k-threats{background:color-mix(in srgb,var(--find) 16%,var(--box));}
a.ref.k-controls{background:color-mix(in srgb,var(--loop) 16%,var(--box));}
a.ref.k-verification{background:color-mix(in srgb,var(--verif) 20%,var(--box));}
a.ref:hover{background:var(--accent)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:10px 0 14px;font-size:13.5px}
.toolbar input[type=search],.toolbar select{background:var(--box);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px}
.toolbar input[type=search]{min-width:260px;-webkit-appearance:none;appearance:none}
.toolbar label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--box);cursor:pointer}
.toolbar .count{color:var(--muted);margin-left:auto}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px}

/* threats */
details.threat{border:1px solid var(--line);border-top:3px solid var(--accent);margin:12px 0;background:var(--box)}
details.threat>summary{cursor:pointer;padding:14px 18px;list-style:none;display:flex;gap:8px 10px;align-items:baseline;flex-wrap:wrap}
details.threat>summary::-webkit-details-marker{display:none}
details.threat>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
details.threat[open]>summary::after{content:"\2212"}
details.threat .stitle{font-family:var(--f-display);font-weight:600;font-size:17.5px;flex:1 1 380px}
details.threat .body{padding:2px 18px 18px;border-top:1px solid var(--line)}
details.threat .body>p:first-child{font-size:17px;margin-top:14px;max-width:95ch}
details.fold{border-top:1px solid var(--line);padding:10px 0}
details.fold:last-of-type{border-bottom:1px solid var(--line)}
details.fold>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px}
details.fold>summary small{font-family:var(--f-body);font-weight:400;color:var(--muted);margin-left:8px}
dl.fields{display:grid;grid-template-columns:190px minmax(0,1fr);gap:7px 16px;margin:10px 0;font-size:15px}
dl.fields dt{color:var(--muted);font-size:13.5px}
dl.fields dd{margin:0}
.route{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 0;margin:10px 0 14px}
.route .hop{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);padding:7px 11px;font-size:13.5px;line-height:1.3;max-width:230px}
.route .hop small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.route .hop.vendor{border-left-color:var(--muted)} .route .hop.goal{border-left-color:var(--bad)}
.route .arrow{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:44px;padding:0 6px;color:var(--muted);font-size:17px;line-height:1}
.route .arrow small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--bad);margin-top:3px;text-align:center;max-width:150px;line-height:1.25}
ol.cases{margin:0;padding-left:20px} ol.cases li{margin:3px 0}
.criteria{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.criteria div{padding:10px 12px;font-size:14px;border-left:3px solid var(--line);background:var(--panel)}
.criteria .pass{border-color:var(--loop)} .criteria .fail{border-color:var(--bad)} .criteria .inc{border-color:var(--verif)}
.criteria b{display:block;font-family:var(--f-display);font-size:12.5px;color:var(--sub)}
pre{background:var(--codebg);color:var(--codeink);padding:12px 14px;font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}
.tree ul{list-style:none;padding-left:22px;border-left:1px dashed var(--line);margin:4px 0}
.op{font-family:var(--f-mono);font-size:11px;padding:0 5px;border-radius:3px;background:var(--sub);color:var(--bg);margin-right:6px}

/* architecture diagram */
.dia{border:1px solid var(--line);background:var(--panel);margin-top:8px}
.diahead{background:var(--bandbg);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.diahead b{font-family:var(--f-display);font-weight:600;font-size:15px;margin-right:auto}
.diahead label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.diahead .k{display:inline-flex;gap:6px;align-items:center;color:var(--bandsub)}
.diahead i{display:inline-block;width:26px;height:0;border-top:2px solid #b9b2c4}
.diahead i.x{border-top:2px dashed #ff8a5c}
.zooms{display:inline-flex;gap:4px}.zooms .btn{background:#2a2136;border-color:#4a3a66;color:#fff;padding:2px 11px}
.diascroll{overflow:auto;padding:8px}
.diascroll svg{display:block;margin:0 auto;max-width:none}
.diainfo{border-top:1px solid var(--line);padding:10px 16px;font-size:14px;min-height:42px;background:var(--box)}
svg text{font-family:var(--f-body)}
svg .node{cursor:pointer}
svg .node rect.b{fill:var(--box);stroke:var(--line);stroke-width:1.2}
svg .node:hover rect.b,svg .node.sel rect.b{stroke:var(--accent);stroke-width:2}
svg .node>text,svg .node>rect.bar,svg .chip text,svg .edge .el text{pointer-events:none}
svg .node .nid{font-family:var(--f-mono);font-size:11px;fill:var(--sub)}
svg .node .nk{font-size:10.5px;fill:var(--muted)}
svg .node .nn{font-size:13.5px;font-weight:600;fill:var(--ink)}
svg .node.n-actors rect.b{fill:var(--bandbg);stroke:var(--bandbg)}
svg .node.n-actors .nid{fill:var(--bandsub)} svg .node.n-actors .nk{fill:#cfc6dc} svg .node.n-actors .nn{fill:#fff}
svg .node.n-entry_points rect.b{fill:var(--panel2);stroke:var(--sub)}
svg .node.n-ext rect.b{fill:var(--src);stroke:var(--srcline)}
svg .node.n-unknown rect.b{fill:var(--badbg);stroke:var(--bad);stroke-dasharray:5 4}
svg .node rect.bar{fill:var(--accent)}
svg .edge path{fill:none;stroke:var(--guard);stroke-width:1.5}
svg .edge.x path{stroke:var(--find);stroke-dasharray:6 4}
svg .edge .el{cursor:pointer}
svg .edge .el rect{fill:var(--panel);stroke:var(--line)}
svg .edge.x .el rect{stroke:var(--find)}
svg .edge .el text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
svg .chip{cursor:pointer}
svg .chip text{font-family:var(--f-mono);font-size:10.5px;fill:#fff;font-weight:500}
svg .chip-t rect{fill:#e0541b} svg .chip-c rect{fill:#00705c} svg .chip-v rect{fill:#9a5200}
svg .chip:hover rect,svg .chip:focus rect{stroke:var(--ink);stroke-width:2}
svg.hide-t .chip-t,svg.hide-c .chip-c,svg.hide-v .chip-v{display:none}
svg .dim{opacity:.14}
#tip{position:fixed;z-index:80;max-width:380px;background:#16121d;color:#fff;border:1px solid #4a3a66;border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.4;box-shadow:0 10px 32px rgba(0,0,0,.35);pointer-events:none}
#tip b{display:block;font-family:var(--f-display);font-weight:600;margin-bottom:2px}
#tip small{display:block;color:#d2a5ff;font-size:12px;margin-bottom:4px}
#tip em{display:block;font-style:normal;color:#a995c4;font-size:12px;margin-top:6px}

/* risk matrix */
table.rm{table-layout:fixed;border-collapse:separate;border-spacing:3px;font-size:13.5px}
table.rm th,table.rm td{border:0;padding:8px;text-align:center;vertical-align:middle;white-space:normal}
table.rm th{background:var(--panel);font-size:13px}
table.rm th small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:11.5px;line-height:1.3}
table.rm td.cell{color:#fff;font-family:var(--f-display);font-weight:600;height:74px}
table.rm td.cell .ref{display:inline-block;margin:3px 2px 0;background:rgba(255,255,255,.92);color:#000}
table.rm .axis{background:var(--bandbg);color:#fff;font-family:var(--f-display)}
.foot{margin-top:70px;padding-top:16px;border-top:3px solid var(--ink);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:1000px){body{display:block}#side{position:static;height:auto}#page{padding:18px 18px 60px}.two{grid-template-columns:1fr;gap:20px}dl.fields{grid-template-columns:1fr}.criteria{grid-template-columns:1fr}}
@page{size:A4 landscape;margin:12mm}
@media print{
  body{display:block;font-size:11pt}
  #side,.toolbar,.noprint,#tip{display:none!important}
  #page{max-width:none;padding:0}
  .classification{position:fixed;left:0;right:0;top:0}
  section.sec{break-before:page;margin-top:0;padding-top:6mm}
  .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card,details.threat,tr,.nums,.dia,.criteria,.klist li,ol.steps li{break-inside:avoid}
  .diascroll{overflow:visible}.diascroll svg{width:100%!important;max-width:100%;height:auto}
  svg .dim{opacity:1}
  .hidden{display:revert!important}
  a{text-decoration:none}
}

/* round 3: verdicts, coverage, plans */
.verdicts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0 8px}
.vcard{background:var(--box);border:1px solid var(--line);border-top:3px solid var(--accent);padding:18px 20px 16px;display:flex;flex-direction:column}
.vcard h4{margin:0 0 10px}
.vbig{display:flex;gap:12px;align-items:baseline;margin-bottom:8px}
.vbig b{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--accent);white-space:nowrap}
.vbig span{font-size:14.5px;line-height:1.3;color:var(--muted)}
.vcard p{font-size:15.5px;line-height:1.5;margin:0 0 12px}
.vcard a{margin-top:auto;font-size:14px}
.tick{white-space:pre;color:var(--muted);font-size:13px}
.do{display:inline-block;min-width:54px;font-family:var(--f-display);font-weight:600;font-size:12.5px;color:var(--sub)}
.riskcell{white-space:nowrap}.riskcell .arrow{color:var(--muted)}
.tag.rating{color:#fff}
.prio{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12.5px;border-radius:999px;padding:1px 10px;background:var(--neutralbg);color:var(--neutral)}
.prio.p1{background:var(--bad);color:var(--bg)}.prio.p2{background:var(--find);color:#fff}.prio.p3{background:var(--riskbg);color:var(--risk)}
.tl{line-height:1.45}

  }

  // ====================================================================
  // Assemble
  // ====================================================================
  var page = h('div', { id: 'page' });
  function safe(fn, id, name) { try { return fn(); } catch (e) { return h('section', { class: 'sec', id: id }, h('p', { class: 'basis' }, name + ' could not be displayed: ' + str(e && e.message))); } }
  // A shorter pack for the client validation call: what we understood, for them to confirm or correct.
  function tick(words) { return { title: words, width: '120px', sort: false, render: function () { return h('span', { class: 'tick' }, '\u2610 Yes   \u2610 No'); } }; }
  function packPage() {
    var es = obj(eng.executive_summary), overview = paras(es.system_overview).length ? paras(es.system_overview) : paras(M.scope && M.scope.description);
    var comps = arr(sys.actors).concat(arr(sys.entry_points), arr(sys.assets));
    return [cover(),
      h('div', { class: 'basis' }, h('h4', null, 'Purpose of this pack'), h('p', null, 'This is a draft for discussion. It sets out our understanding of the system, the controls we believe are in place and the threats identified so far. Please tell us what is wrong, missing or out of date. Nothing here is final, and no risk ratings have been agreed.')),
      section('pack-system', '1', 'The system as we understand it', null, [overview.map(function (p) { return h('p', { class: 'lead' }, p); }), h('h3', null, 'Architecture'), diagram()]),
      section('pack-components', '2', 'Components and who runs them', 'Please correct any component, description or owner that is wrong.', comps.length ? table([idCol(), col('Component', function (r) { return h('b', null, str(r.description)); }), col('Kind', function (r) { return str(r.kind); }),
        col('Run by', function (r) { return respTag(r.id) || h('span', { class: 'empty' }, 'To confirm'); }), { title: 'Based on', sort: false, render: function (r) { return basisChips(r); } }, tick('Correct?')], comps) : empty('No components recorded.')),
      section('pack-assumptions', '3', 'Assumptions to confirm', 'Our findings depend on these. Please tell us if any is not true.', assumptions().length ? table([col('Assumption', function (a) { return str(a.statement); }, '50%'), { title: 'Relied on by', sort: false, render: function (a) { return arr(a.refs).length ? refs(a.refs) : h('span', { class: 'empty' }, 'The assessment as a whole'); } }, tick('True?')], assumptions()) : empty('No assumptions recorded.')),
      section('pack-controls', '4', 'Controls we believe are in place', 'Please confirm that each control exists and works as described.', controls.length ? table([idCol(), { title: 'Control', width: '38%', sort: false, render: function (c) { return h('span', null, str(meta(c.id).title) ? h('b', { class: 'line' }, str(meta(c.id).title)) : null, str(c.description), c.limitations ? h('span', { class: 'line note' }, 'Limit: ' + str(c.limitations)) : null); } },
        col('Status', function (c) { return tag(c.status); }), { title: 'Based on', sort: false, render: function (c) { return basisChips(c); } }, { title: 'Addresses', sort: false, render: function (c) { return refs(c.threat_refs); } }, tick('Confirmed?')], controls) : empty('No controls recorded.')),
      section('pack-threats', '5', 'Draft threats', 'Do these look right for your system? Is anything missing?', sortedThreats.length ? table([idCol(), { title: 'Threat', width: '36%', sort: false, render: function (t) { return h('span', null, h('b', { class: 'line' }, nameOf(t.id)), str(t.scenario)); } },
        col('Why it matters', function (t) { return tba(meta(t.id).impact, 'To discuss'); }), { title: 'Control today', sort: false, render: function (t) { return h('span', null, covTag(t), h('span', { class: 'line' }, covNote(t))); } }, tick('Agree?')], sortedThreats) : empty('No threats recorded yet.')),
      section('pack-questions', '6', 'Open questions', 'What we could not establish from the material. Answers here may change the threats above.', openGaps.length ? table([idCol(), col('What we do not know', function (g) { return str(g.description); }), col('What would settle it', function (g) { return str(g.needed); }), { title: 'Affects', sort: false, render: function (g) { return refs(g.affected_refs); } }], openGaps) : empty('No open questions.')),
      h('footer', { class: 'foot' }, h('span', null, str(branding.footer_text) || str(branding.organisation)), h('span', null, 'Draft for validation \u00b7 ' + str(eng.report_date || eng.generated_at)))];
  }
  var isPack = obj(eng.options).pack === 'validation';
  if (isPack) { reportStatus = 'Draft for validation'; isFinal = false; }
  append(page, isPack ? (function () { try { return packPage(); } catch (e) { return [h('p', { class: 'basis' }, 'The validation pack could not be displayed: ' + str(e && e.message))]; } })() : [cover(), documentControl(),
    data.status !== 'complete' ? h('p', { class: 'basis' }, h('b', null, 'Draft. '), 'The underlying assessment is marked incomplete, so parts of this report may be missing.') : null,
    safe(execSummary, 'exec', 'Executive summary'), safe(techSummary, 'tech', 'Technical summary'), safe(threatsSection, 'threats', 'Threats'), safe(controlsSection, 'controls', 'Controls'),
    safe(recsSection, 'recs', 'Recommendations'), safe(verifSection, 'verif', 'Verification'), obj(eng.options).test_plan === false ? null : safe(pentestSection, 'pentest', 'Penetration test plan'), safe(scopeSection, 'scope', 'Scope and approach'),
    safe(appendixA, 'app-a', 'Appendix A'), safe(appendixB, 'app-b', 'Appendix B'), safe(appendixC, 'app-c', 'Appendix C'),
    h('footer', { class: 'foot' }, h('span', null, str(branding.footer_text) || str(branding.organisation)), h('span', null, [eng.report_version ? 'Version ' + str(eng.report_version) : null, eng.report_date || eng.generated_at].filter(Boolean).join(' \u00b7 ')))]);

  var nav = h('nav', { id: 'sidenav', 'aria-label': 'Contents' });
  var navLinks = {};

    var a = h('a', { href: '#' + n.id }, (/^\d/.test(n.num) ? n.num + '  ' : n.num.replace('Appendix ', '') + '  ') + n.title); navLinks[n.id] = a; nav.appendChild(a);

})();
