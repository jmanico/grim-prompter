        { title: 'Statement', value: function (r) { return r.statement; }, render: function (r) { return h('div', null, str(r.statement), showEx && r.excerpt ? h('pre', null, r.excerpt) : null, r.limitations ? h('p', { class: 'muted small' }, 'Limitations: ' + r.limitations) : null); } },
        { title: 'Kind', value: function (r) { return r.source_kind; }, render: function (r) { return str(r.source_kind); } },
        { title: 'Status', value: function (r) { return r.status; }, render: function (r) { return badge(r.status, 'evstatus'); } },
        { title: 'Purpose', value: function (r) { return r.purpose; }, render: function (r) { return str(r.purpose); } },
        { title: 'Access', value: function (r) { return r.access; }, render: function (r) { return badge(r.access, 'access'); } }], rows, { anchor: true, noun: 'evidence' })];
  };

  R['visualizations'] = function () {
    var rows = arr(M.visualizations); if (!rows.length) return [empty()];
    return [rows.map(function (v) {
      return h('div', { class: 'card', id: anchor(v.id) }, h('div', { class: 'card-head' }, h('span', { class: 'tid' }, v.id), badge(v.kind, 'viz'), h('span', { class: 'muted small' }, v.format), badge(v.status, 'viz')),
        h('p', null, v.text_equivalent), h('pre', null, v.content), h('p', { class: 'small' }, 'Records: ', refs(v.record_refs)));
    })];
  };

  R['appendix'] = function (o) {
    o = o || {};
    var out = [h('h3', null, 'Envelope'), fields([['Schema version', str(data.schema_version)], ['Artifact type', str(data.artifact_type)], ['Model ID', str(data.model_id)],
      ['Revision', str(data.revision)], ['Parent revision', str(data.parent_revision)], ['Status', str(data.status)], ['Source file', str(config.source_file)]])];
    var att = arr(data.attachments);
    if (att.length) {
      out.push(h('h3', null, 'Attachments carried in the model'));
      out.push(table([idCol(), { title: 'Kind', value: function (a) { return a.kind; }, render: function (a) { return str(a.kind); } },
        { title: 'Origin', value: function (a) { return a.origin; }, render: function (a) { return str(a.origin); } },
        { title: 'Access', value: function (a) { return a.access; }, render: function (a) { return str(a.access); } },
        { title: 'Redaction', value: function (a) { return a.redaction && a.redaction.status; }, render: function (a) { return str(a.redaction && a.redaction.status); } }], att));
      out.push(h('p', { class: 'muted small' }, 'Attachment contents are not displayed in this report.'));
    }
    var otherCov = arr(M.coverage).filter(function (c) { return c.lens !== 'inspection-coverage'; });
    if (otherCov.length) {
      out.push(h('h3', null, 'Analysis coverage'));
      out.push(searchableTable([idCol(), { title: 'Lens', value: function (c) { return c.lens; }, render: function (c) { return str(c.lens); } },
        { title: 'Target', sort: false, render: function (c) { return c.target_ref ? ref(c.target_ref) : h('span', { class: 'muted' }, 'scope-wide'); } },
        { title: 'Status', value: function (c) { return c.status; }, render: function (c) { return badge(c.status, 'coverage'); } },
        { title: 'Reason', value: function (c) { return c.reason; }, render: function (c) { return str(c.reason); } }], otherCov, { anchor: true, noun: 'coverage records' }));
    }
    if (ignored.length) out.push(h('div', { class: 'callout warn' }, 'Unknown sections in the report configuration were ignored: ' + ignored.join(', ')));
    if (o.include_raw_json !== false && interactive) {
      var btn = h('button', { type: 'button', class: 'no-print' }, 'Download the embedded model JSON');
      btn.addEventListener('click', function () {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (str(data.model_id) || 'threat-model').replace(/[^A-Za-z0-9._-]/g, '_') + '-' + (str(data.revision) || 'rev').replace(/[^A-Za-z0-9._-]/g, '_') + '.json';
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      });
      out.push(h('h3', null, 'Source data'), h('p', { class: 'small' }, 'This file embeds the complete model JSON it was built from.'), btn);
    }
    return out;
  };

  // ---------- Assemble ----------
  var cls1 = branding.classification && typeof branding.classification === 'object' ? branding.classification : null;
  function banner(pos) {
    if (!cls1 || !cls1.label) return null;
    var b = h('div', { class: 'classification ' + pos, role: 'note' }, str(cls1.label));
    b.style.background = colorRe.test(str(cls1.color)) ? cls1.color : '#b4232a';
    return b;
  }
  var main = h('main');
  var toc = h('nav', { class: 'toc', 'aria-label': 'Contents' }, h('div', { class: 'toc-title' }, 'Contents'));
  plan.forEach(function (c) {
    var fn = R[c.id]; if (!fn) return;
    var content;
    try { content = fn(c.options || {}); }
    catch (e) { content = [h('div', { class: 'callout bad' }, 'This section could not be displayed: ' + str(e && e.message))]; }
    var title = c.title ? str(c.title) : SECTION_TITLES[c.id];
    var sec = h('section', { class: 'section sec-' + c.id, id: 'sec-' + c.id }, c.id === 'cover' ? null : h('h2', null, title), content);
    main.appendChild(sec);
    toc.appendChild(h('a', { href: '#sec-' + c.id }, title));
  });
  var actions = h('div', { class: 'toc-actions' });
  var printBtn = h('button', { type: 'button' }, 'Print or save as PDF');
  printBtn.addEventListener('click', function () { window.print(); });
  actions.appendChild(printBtn);
  toc.appendChild(actions);
  main.appendChild(h('footer', { class: 'report-footer' },
    h('span', null, str(branding.footer_text) || (branding.organisation ? branding.organisation : '')),
    h('span', null, 'Model ' + str(data.model_id) + ' rev ' + str(data.revision) + (config.generated_at ? ' · generated ' + config.generated_at : '') + ' · Grim Prompter report builder')));

  app.textContent = '';
  append(app, [banner('top'), h('div', { class: 'layout' }, toc, main), banner('bottom')]);
  if (logoOk) { var img = app.querySelector('img.logo'); if (img) img.src = branding.logo_data_uri; }

  // Resolve references: link only to records shown in this report.
  Array.prototype.forEach.call(app.querySelectorAll('a.ref'), function (a) {
    var id = a.getAttribute('data-ref');
    if (!document.getElementById(anchor(id))) {
      var sp = h('span', { class: 'ref' + (byId.has(id) ? '' : ' dangling'), title: byId.has(id) ? label(id) + ' (section not included in this report)' : 'Reference not found in the model' }, id);
      a.replaceWith(sp);
    }
  });
  // Open a targeted threat when following a link.
  function openTarget() { var id = decodeURIComponent(location.hash.slice(1)); var el = id && document.getElementById(id); if (el && el.tagName === 'DETAILS') el.open = true; }
  window.addEventListener('hashchange', openTarget); openTarget();
  // Print everything expanded.
  var reopen = [];
  window.addEventListener('beforeprint', function () { reopen = []; Array.prototype.forEach.call(app.querySelectorAll('details'), function (d) { if (!d.open) { d.open = true; reopen.push(d); } }); });
  window.addEventListener('afterprint', function () { reopen.forEach(function (d) { d.open = false; }); reopen = []; });
})();
</script>
</body>
</html>
